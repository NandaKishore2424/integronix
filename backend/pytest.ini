[pytest]
testpaths = tests
# Unit tests are the default run and the CI gate. Integration tests hit live
# Supabase and Groq; they are selected explicitly with `-m integration` and
# skip themselves when credentials are absent.
addopts =
    -q
    --strict-markers
    --strict-config
markers =
    integration: requires a live backend, Supabase and Groq connection
filterwarnings =
    ignore::DeprecationWarning:supabase.*
    ignore::DeprecationWarning:gotrue.*
