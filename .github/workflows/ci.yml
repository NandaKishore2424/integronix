name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # torch and sentence-transformers are large and only needed by the
      # embedding paths, which unit tests never execute. Installing the CPU
      # wheel index keeps the CI image from pulling the CUDA build (~2.5 GB).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      # --cov-fail-under is a ratchet, not a target: it stops coverage
      # rotting when tests are deleted. The number that matters is the
      # per-module coverage of the money paths (payer_policy_gate, the EDI
      # and FHIR builders, models), which sit at 86-96%.
      #
      # No secrets are configured for this job on purpose. Tests that need a
      # live Supabase or Groq are marked `integration` and skip themselves, so
      # a green run here proves the suite is genuinely hermetic — if a test
      # quietly starts reaching the network, CI fails and we find out here
      # rather than on someone else's machine.
      - name: Run tests
        run: >
          python -m pytest
          --cov --cov-report=term-missing --cov-report=xml
          --cov-fail-under=35

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Next reads NEXT_PUBLIC_* at build time. These are placeholders: the
      # build only needs them to be present and well-formed, and no real
      # project secrets belong in a CI config.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm build
