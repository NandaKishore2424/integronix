name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # torch and sentence-transformers are large and only needed by the
      # embedding paths, which unit tests never execute. Installing the CPU
      # wheel index keeps the CI image from pulling the CUDA build (~2.5 GB).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      # --cov-fail-under is a ratchet, not a target: it stops coverage
      # rotting when tests are deleted. The number that matters is the
      # per-module coverage of the money paths (payer_policy_gate, the EDI
      # and FHIR builders, models), which sit at 86-96%.
      #
      # No secrets are configured for this job on purpose. Tests that need a
      # live Supabase or Groq are marked `integration` and skip themselves, so
      # a green run here proves the suite is genuinely hermetic — if a test
      # quietly starts reaching the network, CI fails and we find out here
      # rather than on someone else's machine.
      - name: Run tests
        run: >
          python -m pytest
          --cov --cov-report=term-missing --cov-report=xml
          --cov-fail-under=35

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Next reads NEXT_PUBLIC_* at build time. These are placeholders: the
      # build only needs them to be present and well-formed, and no real
      # project secrets belong in a CI config.
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm build

  docker:
    name: Backend — image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only after the tests pass: a broken image is not worth 20 minutes of
    # runner time if the code itself is red.
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. The point is to catch a Dockerfile that no
      # longer builds — a missing system package, a bad COPY path — at commit
      # time rather than during a deploy. Layer caching via GitHub Actions
      # cache keeps the repeat cost to a couple of minutes despite torch.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: integronix-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}

      # Proves the image actually starts and serves, not merely that it built.
      # No credentials, so readiness correctly reports 503 — what matters here
      # is that the process boots, binds, and answers with a request id.
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e SUPABASE_URL=http://127.0.0.1:1/placeholder \
            -e SUPABASE_ANON_KEY=placeholder \
            -e GROQ_API_KEY=placeholder \
            integronix-backend:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then
              echo "liveness OK after ${i}s"; break
            fi
            sleep 1
          done

          echo "--- liveness ---"
          curl -fsS http://localhost:8000/health/live

          echo "--- readiness (expect 503: no database configured) ---"
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/health)
          cat /tmp/ready.json; echo
          test "$code" = "503" || { echo "expected 503, got $code"; exit 1; }

          echo "--- correlation id header ---"
          curl -s -o /dev/null -D - http://localhost:8000/health/live | grep -i x-request-id

          echo "--- endpoints still require auth ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/cases)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }

          docker rm -f smoke >/dev/null
